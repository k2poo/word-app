<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>家計簿アプリ（残高修正・完全同期・編集機能強化版）</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>

<style>
body { font-family: sans-serif; background:#f5f5f5; margin:0; }
.container { padding:10px; max-width: 600px; margin: auto; }
.card { background:white; border-radius:12px; padding:15px; margin:10px 0; box-shadow:0 2px 8px rgba(0,0,0,0.1); }
button { width:100%; padding:12px; margin:5px 0; border:none; border-radius:8px; background:#4CAF50; color:white; font-size: 16px; cursor: pointer; }
button:hover { background:#45a049; }
button:disabled { background:#9e9e9e; cursor:not-allowed; }
input, select, textarea { width:100%; padding:10px; margin:5px 0; border-radius:8px; border:1px solid #ccc; box-sizing: border-box; font-size: 16px; }
.hidden { display:none; }
.summary-area { margin-bottom: 15px; padding: 15px; background: #e3f2fd; border-radius: 8px; text-align: left; }
.asset-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 14px; margin-top: 10px; }
.asset-item { background: rgba(255,255,255,0.7); padding: 8px; border-radius: 6px; border: 1px solid #d1e9ff; }
.history-item { border-bottom: 1px solid #eee; padding: 10px 0; }
</style>
</head>
<body>
<div class="container">
<h2>家計簿アプリ</h2>

<div id="home" class="card">
  <div class="auth-area" style="text-align:center; border-bottom:1px solid #eee; padding-bottom:15px; margin-bottom:15px;">
    <div id="authStatus" style="margin-bottom:10px; font-weight:bold; color:#757575;">接続中...</div>
    <button id="loginBtn" onclick="login()" class="hidden" style="background:#4285F4;">Googleでログイン</button>
    <button id="logoutBtn" onclick="logout()" class="hidden" style="background:#f44336;">ログアウト</button>
  </div>

  <div id="homeSummary" class="summary-area">最新データを取得しています...</div>

<button onclick="show('plan')">今日の支出予定</button>
<button onclick="show('result')">本日の支出結果</button>
<button onclick="show('income')">収入入力</button>
<button onclick="show('assetStatus')">日付別 残高確認</button>
<button onclick="show('assetAdjust')" style="background:#FF9800;">残高修正（金額を上書き）</button>
<button onclick="show('monthly')">月の集計</button>
<button onclick="show('yearly')">年の集計</button>
<button onclick="show('history')">履歴一覧</button>
<button onclick="show('editDay')" style="background:#9C27B0;">日付編集（修正・追加・削除）</button>
<button onclick="exportCSV()" style="background:#2196F3;">CSV出力</button>
</div>

<div id="assetStatus" class="card hidden">
  <h3>日付指定の残高確認</h3>
  <input type="date" id="checkDate" onchange="updateAssetDisplay()">
  <div id="assetResult" class="summary-area"></div>
  <button onclick="back()" style="background:#757575;">戻る</button>
</div>

<div id="assetAdjust" class="card hidden">
  <h3>残高修正</h3>
  <p style="font-size:12px; color:#666;">※指定した日の「最終残高」を確定します。この日の支出や収入より優先され、以降はこの金額を基準に増減します。</p>
  <input type="date" id="adjustDate">
  <select id="adjustAsset"></select>
  <input type="number" id="adjustAmount" placeholder="修正後の最終金額">
  <button id="adjustSaveBtn" onclick="saveAdjustment()" style="background:#FF9800;">確定してサーバーに保存</button>
  <button onclick="back()" style="background:#757575;">戻る</button>
</div>

<div id="plan" class="card hidden">
<h3>支出予定</h3>
<div id="planDate" style="margin-bottom:10px; font-weight:bold;"></div>
<input type="number" id="planAmount" placeholder="金額"><input type="text" id="planPurpose" placeholder="用途">
<select id="planAsset"></select><select id="planCategory"></select>
<button onclick="savePlan()">保存</button>
<button onclick="back()" style="background:#757575;">戻る</button>
</div>

<div id="result" class="card hidden">
<h3>支出結果</h3>
<div id="resultDate" style="margin-bottom:10px; font-weight:bold;"></div>
<input type="number" id="resultAmount" placeholder="金額"><input type="text" id="resultPurpose" placeholder="用途">
<select id="resultAsset"></select><select id="resultCategory"></select>
<textarea id="reflection" placeholder="振り返り"></textarea>
<button onclick="saveResult()">保存</button>
<button onclick="back()" style="background:#757575;">戻る</button>
</div>

<div id="income" class="card hidden">
<h3>収入入力</h3>
<input type="date" id="incomeDate">
<input type="number" id="incomeAmount" placeholder="金額">
<select id="incomeAsset"></select>
<select id="incomeType"><option>給与</option><option>臨時</option><option>年金</option><option>副業</option><option>その他</option></select>
<button onclick="saveIncome()">保存</button>
<button onclick="back()" style="background:#757575;">戻る</button>
</div>

<div id="monthly" class="card hidden"><h3>月別集計</h3><input type="month" id="monthlyMonth"><canvas id="chart"></canvas><button onclick="back()" style="background:#757575;">戻る</button></div>
<div id="yearly" class="card hidden"><h3>年別集計</h3><input type="number" id="yearlyYear" placeholder="2026"><button onclick="back()" style="background:#757575;">戻る</button></div>
<div id="history" class="card hidden"><h3>履歴一覧</h3><div id="historyList"></div><button onclick="back()" style="background:#757575;">戻る</button></div>

<div id="editDay" class="card hidden">
  <h3>日付データ編集</h3>
  <input type="date" id="editDate" onchange="loadDay()">
  <div id="editArea"></div>
  <button onclick="back()" style="background:#757575;">戻る</button>
</div>

</div>

<script>
const ASSETS = ['現金', '現金預金', '東邦７７７', '東邦市役所', '東邦けやき', 'Sony', 'PayPay', 'PayPayBank1', 'PayPayBank2', 'Mercari'];
const CATEGORIES = ['食費', '日用品', '家計', '園芸', '遊興', 'ガソリン〈エネオス〉', 'クレジット〈東邦〉', 'クレジット〈PayPay〉', 'その他'];

function getLocalYMD(dateObj = new Date()) {
  const y = dateObj.getFullYear();
  const m = String(dateObj.getMonth() + 1).padStart(2, '0');
  const d = String(dateObj.getDate()).padStart(2, '0');
  return `${y}-${m}-${d}`;
}

const firebaseConfig = {
    apiKey: "AIzaSyB9Phxm6u2o8z-ea7qAJqyqj9zTd1R1gAI",
    authDomain: "k2-kakeibo.firebaseapp.com",
    projectId: "k2-kakeibo",
    storageBucket: "k2-kakeibo.firebasestorage.app",
    messagingSenderId: "750885231235",
    appId: "1:750885231235:web:96c9a3a2366b25bf7159b6"
};

if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();
const provider = new firebase.auth.GoogleAuthProvider();

let currentUser = null;
let cachedData = {}; 

function initSelectors() {
  ['planAsset', 'resultAsset', 'incomeAsset', 'adjustAsset'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = ASSETS.map(a => `<option value="${a}">${a}</option>`).join('');
  });
  ['planCategory', 'resultCategory'].forEach(id => {
    const el = document.getElementById(id);
    if(el) el.innerHTML = CATEGORIES.map(c => `<option value="${c}">${c}</option>`).join('');
  });
}
initSelectors();

auth.onAuthStateChanged(async (user) => {
  if (user) {
    currentUser = user;
    document.getElementById('authStatus').innerText = `${user.displayName} さん`;
    document.getElementById('loginBtn').classList.add('hidden');
    document.getElementById('logoutBtn').classList.remove('hidden');
    await loadDataFromFirebase();
  } else {
    currentUser = null; cachedData = {};
    document.getElementById('authStatus').innerText = "未ログイン";
    document.getElementById('loginBtn').classList.remove('hidden');
    document.getElementById('logoutBtn').classList.add('hidden');
    updateHomeSummary();
  }
});

async function loadDataFromFirebase() {
  if (!currentUser) return;
  try {
    const doc = await db.collection('kakeibo_data').doc(currentUser.uid).get();
    if (doc.exists) {
      cachedData = doc.data().records || {};
    }
  } catch (e) { console.error("データ読み込みエラー:", e); }
  updateHomeSummary();
}

async function saveData(d){ 
  if (!currentUser) throw new Error("ログインが必要です");
  cachedData = d; 
  await db.collection('kakeibo_data').doc(currentUser.uid).set({ records: d });
  updateHomeSummary();
}

function calculateBalances(targetDateStr) {
  let balances = {};
  ASSETS.forEach(a => balances[a] = 0);
  const sortedKeys = Object.keys(cachedData).sort();
  
  for (let dateKey of sortedKeys) {
    if (dateKey > targetDateStr) break;
    let dayData = cachedData[dateKey];
    
    if (dayData.income) {
      dayData.income.forEach(inc => { if (balances[inc.asset] !== undefined) balances[inc.asset] += Number(inc.amount); });
    }
    if (dayData.result) {
      let results = Array.isArray(dayData.result) ? dayData.result : [dayData.result];
      results.forEach(res => { if (balances[res.asset] !== undefined) balances[res.asset] -= Number(res.amount); });
    }
    if (dayData.adjust) {
      Object.keys(dayData.adjust).forEach(asset => balances[asset] = Number(dayData.adjust[asset]));
    }
  }
  return balances;
}

function updateHomeSummary() {
  if(!currentUser) {
    document.getElementById('homeSummary').innerHTML = "ログインしてデータを取得してください";
    return;
  }
  const today = getLocalYMD(); 
  const bals = calculateBalances(today);
  const total = Object.values(bals).reduce((a, b) => a + b, 0);
  let html = `<div style="font-size:18px; font-weight:bold; color:#1565c0; border-bottom:2px solid #1565c0; padding-bottom:5px; margin-bottom:10px;">現在の総資産: ${total.toLocaleString()}円</div><div class="asset-grid">`;
  ASSETS.forEach(a => { html += `<div class="asset-item">${a}<br><strong>${bals[a].toLocaleString()}円</strong></div>`; });
  html += `</div>`;
  document.getElementById('homeSummary').innerHTML = html;
}

function updateAssetDisplay() {
  const date = document.getElementById('checkDate').value;
  if(!date) return;
  const bals = calculateBalances(date);
  const total = Object.values(bals).reduce((a, b) => a + b, 0);
  let html = `<h4>${date} 時点の残高</h4><div class="asset-grid">`;
  ASSETS.forEach(a => { html += `<div class="asset-item">${a}<br><strong>${bals[a].toLocaleString()}円</strong></div>`; });
  html += `</div><div style="margin-top:15px; font-weight:bold; font-size:18px;">合計: ${total.toLocaleString()}円</div>`;
  document.getElementById('assetResult').innerHTML = html;
}

async function saveAdjustment() {
  const date = document.getElementById('adjustDate').value;
  const asset = document.getElementById('adjustAsset').value;
  const amt = document.getElementById('adjustAmount').value;
  if(!date || amt === '') return alert('日付と金額を入力してください');
  
  const btn = document.getElementById('adjustSaveBtn');
  btn.disabled = true; btn.innerText = "サーバーに保存中...";

  try {
    let d = JSON.parse(JSON.stringify(cachedData));
    if(!d[date]) d[date] = {};
    if(!d[date].adjust) d[date].adjust = {};
    d[date].adjust[asset] = Number(amt);
    
    await saveData(d);
    alert(`${date} の ${asset} を ${Number(amt).toLocaleString()}円 に確定・保存しました。`);
    document.getElementById('adjustAmount').value = '';
    
  } catch(error) {
    alert("保存エラー: " + error.message);
  } finally {
    btn.disabled = false; btn.innerText = "確定してサーバーに保存";
  }
}

function login() { auth.signInWithPopup(provider); }
function logout() { auth.signOut().then(() => location.reload()); }

function show(id){ 
  document.querySelectorAll('.card').forEach(d => d.classList.add('hidden')); 
  document.getElementById(id).classList.remove('hidden'); 
  
  const todayStr = getLocalYMD();
  if(id === 'home') updateHomeSummary();
  if(id === 'assetStatus') { document.getElementById('checkDate').value = todayStr; updateAssetDisplay(); }
  if(id === 'assetAdjust') document.getElementById('adjustDate').value = todayStr;
  if(id === 'plan') { document.getElementById('planDate').innerText = todayStr; }
  if(id === 'result') { document.getElementById('resultDate').innerText = todayStr; }
  if(id === 'income') document.getElementById('incomeDate').value = todayStr;
  if(id === 'history') loadHistory();
  if(id === 'editDay') { document.getElementById('editDate').value = todayStr; loadDay(); } // 今日の日付で自動読込
}
function back(){ show('home'); }

async function savePlan(){ 
  let d = JSON.parse(JSON.stringify(cachedData)), k = getLocalYMD(); 
  d[k] = d[k] || {}; d[k].plan = d[k].plan || [];
  d[k].plan.push({ amount: document.getElementById('planAmount').value, purpose: document.getElementById('planPurpose').value, category: document.getElementById('planCategory').value, asset: document.getElementById('planAsset').value }); 
  await saveData(d); alert('予定を保存しました');
  document.getElementById('planAmount').value=''; document.getElementById('planPurpose').value='';
}

async function saveResult(){ 
  let d = JSON.parse(JSON.stringify(cachedData)), k = getLocalYMD(); 
  d[k] = d[k] || {}; d[k].result = d[k].result || [];
  d[k].result.push({ amount: document.getElementById('resultAmount').value, purpose: document.getElementById('resultPurpose').value, category: document.getElementById('resultCategory').value, asset: document.getElementById('resultAsset').value, reflection: document.getElementById('reflection').value }); 
  await saveData(d); alert('結果を保存しました');
  document.getElementById('resultAmount').value=''; document.getElementById('resultPurpose').value=''; document.getElementById('reflection').value='';
}

async function saveIncome(){ 
  let d = JSON.parse(JSON.stringify(cachedData)), k = document.getElementById('incomeDate').value; 
  if(!k) return alert('日付を選択してください');
  d[k] = d[k] || {}; d[k].income = d[k].income || []; 
  d[k].income.push({amount: document.getElementById('incomeAmount').value, type: document.getElementById('incomeType').value, asset: document.getElementById('incomeAsset').value}); 
  await saveData(d); alert('収入を保存しました');
  document.getElementById('incomeAmount').value='';
}

function loadHistory(){
  let d = cachedData, html = '';
  let keys = Object.keys(d).sort((a,b) => b.localeCompare(a));
  keys.forEach(k => {
    let day = d[k], items = [];
    if(day.adjust) Object.keys(day.adjust).forEach(a => items.push(`<span style="color:#FF9800; font-weight:bold;">[残高確定] ${a} を ${day.adjust[a].toLocaleString()}円 に上書き</span>`));
    if(day.income) day.income.forEach(i => items.push(`[収入] ${i.amount}円 (${i.asset})`));
    if(day.result) day.result.forEach(r => items.push(`[支出] ${r.amount}円 (${r.asset}) / ${r.purpose}`));
    if(items.length > 0) html += `<div class="history-item"><strong>${k}</strong><br>${items.join('<br>')}</div>`;
  });
  document.getElementById('historyList').innerHTML = html || 'データがありません';
}

function exportCSV(){
  let d = cachedData, rows = [['日付','種別','金額','資産項目']];
  Object.keys(d).sort().forEach(k => {
    if(d[k].adjust) Object.keys(d[k].adjust).forEach(a => rows.push([k,'残高確定',d[k].adjust[a],a]));
    if(d[k].income) d[k].income.forEach(i => rows.push([k,'収入',i.amount,i.asset]));
    if(d[k].result) d[k].result.forEach(r => rows.push([k,'支出',r.amount,r.asset]));
  });
  let a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([rows.map(r=>r.join(',')).join('\n')], {type:'text/csv'})); a.download='kakeibo.csv'; a.click();
}

// ------------------------------------------------------------------
// 【新規追加】日付ごとのデータ編集・修正機能
// ------------------------------------------------------------------
let editCurrentData = null;
let editCurrentDate = null;

function loadDay() {
  const k = document.getElementById('editDate').value;
  if (!k) return;
  editCurrentDate = k;
  let dayData = cachedData[k] || {};
  
  // 編集用のデータオブジェクトを初期化（存在しない場合は空の配列/オブジェクトにする）
  editCurrentData = {
    income: dayData.income ? JSON.parse(JSON.stringify(dayData.income)) : [],
    plan: dayData.plan ? JSON.parse(JSON.stringify(dayData.plan)) : [],
    result: dayData.result ? JSON.parse(JSON.stringify(dayData.result)) : [],
    adjust: dayData.adjust ? JSON.parse(JSON.stringify(dayData.adjust)) : {}
  };
  renderEditArea();
}

function renderEditArea() {
  let html = `<p style="font-size:14px; color:#666;">各項目を修正・削除・追加し、最後に「保存」ボタンを押してください。</p>`;
  
  const createAssetOptions = (selected) => ASSETS.map(a => `<option value="${a}" ${a === selected ? 'selected' : ''}>${a}</option>`).join('');
  const createCategoryOptions = (selected) => CATEGORIES.map(c => `<option value="${c}" ${c === selected ? 'selected' : ''}>${c}</option>`).join('');
  
  // --- 収入エディタ ---
  html += `<div style="background:#e8f5e9; padding:10px; border-radius:8px; margin-bottom:15px;">`;
  html += `<h4 style="margin-top:0;">収入</h4>`;
  editCurrentData.income.forEach((inc, idx) => {
    html += `<div style="background:#fff; border:1px solid #ccc; padding:10px; border-radius:6px; margin-bottom:10px;">
      <input type="number" placeholder="金額" value="${inc.amount}" onchange="editCurrentData.income[${idx}].amount = this.value">
      <select onchange="editCurrentData.income[${idx}].asset = this.value">${createAssetOptions(inc.asset)}</select>
      <select onchange="editCurrentData.income[${idx}].type = this.value">
        <option ${inc.type==='給与'?'selected':''}>給与</option><option ${inc.type==='臨時'?'selected':''}>臨時</option><option ${inc.type==='年金'?'selected':''}>年金</option><option ${inc.type==='副業'?'selected':''}>副業</option><option ${inc.type==='その他'?'selected':''}>その他</option>
      </select>
      <button onclick="editCurrentData.income.splice(${idx},1); renderEditArea();" style="background:#e53935; padding:8px; margin-top:5px;">この収入を削除</button>
    </div>`;
  });
  html += `<button onclick="editCurrentData.income.push({amount:'', type:'給与', asset:'現金'}); renderEditArea();" style="background:#81c784; padding:8px; color:#000;">＋ 収入を追加</button>`;
  html += `</div>`;

  // --- 支出予定エディタ ---
  html += `<div style="background:#fff3e0; padding:10px; border-radius:8px; margin-bottom:15px;">`;
  html += `<h4 style="margin-top:0;">支出予定</h4>`;
  editCurrentData.plan.forEach((p, idx) => {
    html += `<div style="background:#fff; border:1px solid #ccc; padding:10px; border-radius:6px; margin-bottom:10px;">
      <input type="number" placeholder="金額" value="${p.amount}" onchange="editCurrentData.plan[${idx}].amount = this.value">
      <input type="text" placeholder="用途" value="${p.purpose}" onchange="editCurrentData.plan[${idx}].purpose = this.value">
      <select onchange="editCurrentData.plan[${idx}].asset = this.value">${createAssetOptions(p.asset)}</select>
      <select onchange="editCurrentData.plan[${idx}].category = this.value">${createCategoryOptions(p.category)}</select>
      <button onclick="editCurrentData.plan.splice(${idx},1); renderEditArea();" style="background:#e53935; padding:8px; margin-top:5px;">この予定を削除</button>
    </div>`;
  });
  html += `<button onclick="editCurrentData.plan.push({amount:'', purpose:'', category:'食費', asset:'現金'}); renderEditArea();" style="background:#ffb74d; padding:8px; color:#000;">＋ 予定を追加</button>`;
  html += `</div>`;

  // --- 支出結果エディタ ---
  html += `<div style="background:#e3f2fd; padding:10px; border-radius:8px; margin-bottom:15px;">`;
  html += `<h4 style="margin-top:0;">支出結果</h4>`;
  editCurrentData.result.forEach((r, idx) => {
    html += `<div style="background:#fff; border:1px solid #ccc; padding:10px; border-radius:6px; margin-bottom:10px;">
      <input type="number" placeholder="金額" value="${r.amount}" onchange="editCurrentData.result[${idx}].amount = this.value">
      <input type="text" placeholder="用途" value="${r.purpose}" onchange="editCurrentData.result[${idx}].purpose = this.value">
      <select onchange="editCurrentData.result[${idx}].asset = this.value">${createAssetOptions(r.asset)}</select>
      <select onchange="editCurrentData.result[${idx}].category = this.value">${createCategoryOptions(r.category)}</select>
      <textarea placeholder="振り返り" onchange="editCurrentData.result[${idx}].reflection = this.value">${r.reflection || ''}</textarea>
      <button onclick="editCurrentData.result.splice(${idx},1); renderEditArea();" style="background:#e53935; padding:8px; margin-top:5px;">この結果を削除</button>
    </div>`;
  });
  html += `<button onclick="editCurrentData.result.push({amount:'', purpose:'', category:'食費', asset:'現金', reflection:''}); renderEditArea();" style="background:#64b5f6; padding:8px; color:#000;">＋ 結果を追加</button>`;
  html += `</div>`;

  // --- 残高修正エディタ ---
  html += `<div style="background:#f3e5f5; padding:10px; border-radius:8px; margin-bottom:15px;">`;
  html += `<h4 style="margin-top:0;">残高修正</h4>`;
  Object.keys(editCurrentData.adjust).forEach(a => {
    html += `<div style="background:#fff; border:1px solid #ccc; padding:10px; border-radius:6px; margin-bottom:10px;">
      <div style="font-weight:bold; margin-bottom:5px;">${a}</div>
      <input type="number" placeholder="金額" value="${editCurrentData.adjust[a]}" onchange="editCurrentData.adjust['${a}'] = this.value">
      <button onclick="delete editCurrentData.adjust['${a}']; renderEditArea();" style="background:#e53935; padding:8px; margin-top:5px;">この修正を削除</button>
    </div>`;
  });
  html += `<div style="display:flex; gap:5px; margin-top:5px; background:#fff; padding:10px; border:1px solid #ccc; border-radius:6px;">
    <select id="newAdjustAsset" style="flex:1;">${createAssetOptions(ASSETS[0])}</select>
    <input type="number" id="newAdjustAmount" placeholder="金額" style="flex:1;">
    <button onclick="addAdjustEdit()" style="background:#ba68c8; padding:8px; flex:1;">＋ 追加</button>
  </div>`;
  html += `</div>`;

  // --- 保存・全削除ボタン ---
  html += `<hr style="margin: 20px 0; border:none; border-top:1px solid #ccc;">`;
  html += `<button onclick="saveEditDay()" style="background:#4CAF50; font-size:18px; padding:15px; font-weight:bold; margin-bottom:10px;">💾 この内容で上書き保存</button>`;
  html += `<button onclick="deleteDay('${editCurrentDate}')" style="background:#f44336; padding:10px;">⚠️ この日のデータを全削除</button>`;

  document.getElementById('editArea').innerHTML = html;
}

function addAdjustEdit() {
  const asset = document.getElementById('newAdjustAsset').value;
  const amt = document.getElementById('newAdjustAmount').value;
  if(amt === '') return alert('金額を入力してください');
  editCurrentData.adjust[asset] = Number(amt);
  renderEditArea();
}

async function saveEditDay() {
  let dataToSave = {};
  
  // 空欄のデータ（追加ボタンを押しただけで入力しなかった項目）を除外して保存
  const validIncome = editCurrentData.income.filter(i => i.amount !== '');
  if (validIncome.length > 0) dataToSave.income = validIncome;
  
  const validPlan = editCurrentData.plan.filter(p => p.amount !== '');
  if (validPlan.length > 0) dataToSave.plan = validPlan;
  
  const validResult = editCurrentData.result.filter(r => r.amount !== '');
  if (validResult.length > 0) dataToSave.result = validResult;
  
  if (Object.keys(editCurrentData.adjust).length > 0) dataToSave.adjust = editCurrentData.adjust;

  let d = JSON.parse(JSON.stringify(cachedData));
  
  if (Object.keys(dataToSave).length === 0) {
    delete d[editCurrentDate]; // 全て空になった場合はデータ自体を削除
  } else {
    d[editCurrentDate] = dataToSave;
  }
  
  await saveData(d);
  alert(`${editCurrentDate} のデータを保存しました`);
  back();
}

async function deleteDay(k){ 
  if(confirm(`${k} のデータを完全に削除しますか？`)){ 
    let d = JSON.parse(JSON.stringify(cachedData));
    delete d[k]; 
    await saveData(d); 
    alert('削除しました'); 
    back(); 
  } 
}
</script>
</body>
